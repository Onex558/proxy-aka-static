<!DOCTYPE html>
<html>
<head>
  <title>My Proxy</title>
  <style>
    body {
      background: #0f0f13;
      color: white;
      font-family: system-ui;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    input {
      padding: 14px 18px;
      width: 400px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      outline: none;
    }
  </style>
</head>
<body>
  <input id="url" placeholder="Enter URL or search..." autofocus>

  <script>
    document.getElementById("url").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        let val = e.target.value.trim();
        if (!val) return;

        // If it looks like a URL
        if (val.includes(".") && !val.includes(" ")) {
          if (!val.startsWith("http")) val = "https://" + val;
          location.href = "/embed.html#" + val;
        } else {
          // Treat as search
          location.href = "/embed.html#https://duckduckgo.com/?q=" + encodeURIComponent(val);
        }
      }
    });
  </script>
</body>
</html>
