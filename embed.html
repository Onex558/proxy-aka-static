<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy</title>
  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0f13;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #frame {
      width: 100%;
      height: 100%;
    }

    #frame iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      display: block;
    }

    #error {
      display: none;
      padding: 40px;
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
    }

    #error h2 {
      margin-bottom: 12px;
      font-size: 1.4rem;
    }

    #error p {
      color: #aaa;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="frame"></div>
  <div id="error"></div>

  <script>
    // Backup list of Wisp servers
    const WISP_SERVERS = [
      "wss://wisp.mercurywork.shop/",
      "wss://anura.pro/",
      "wss://wisp.reallyarsh.xyz/",
      "wss://wisp.gointospace.app/",
      "wss://glseries.net/wisp/"
    ];

    function showError(msg) {
      document.getElementById("frame").style.display = "none";
      const el = document.getElementById("error");
      el.style.display = "block";
      el.innerHTML = `
        <h2>Connection Failed</h2>
        <p>${msg}</p>
        <p style="margin-top:16px;font-size:14px;color:#666">Try refreshing the page</p>
      `;
    }

    async function tryConnect(connection, servers) {
      for (const wisp of servers) {
        try {
          console.log("Trying Wisp:", wisp);
          await connection.setTransport("/epoxy/index.mjs", [{ wisp }]);
          console.log("Connected to:", wisp);
          return wisp;
        } catch (err) {
          console.warn("Failed:", wisp, err.message);
        }
      }
      throw new Error("All Wisp servers failed to connect");
    }

    async function start() {
      try {
        if (typeof $scramjetLoadController !== "function") {
          throw new Error("Scramjet failed to load. Check /scram/scramjet.all.js");
        }
        if (typeof BareMux === "undefined") {
          throw new Error("BareMux failed to load. Check /baremux/index.js");
        }

        const { ScramjetController } = $scramjetLoadController();

        const scramjet = new ScramjetController({
          files: {
            wasm: "/scram/scramjet.wasm.wasm",
            all: "/scram/scramjet.all.js",
            sync: "/scram/scramjet.sync.js"
          }
        });

        await scramjet.init();
        await navigator.serviceWorker.register("/sw.js");

        const connection = new BareMux.BareMuxConnection("/baremux/worker.js");
        await tryConnect(connection, WISP_SERVERS);

        const frame = scramjet.createFrame();
        document.getElementById("frame").appendChild(frame.frame);

        let url = location.hash.slice(1) || "https://start.duckduckgo.com";
        if (!url.startsWith("http")) url = "https://" + url;

        frame.go(url);
      } catch (err) {
        console.error(err);
        showError(err.message || String(err));
      }
    }

    start();
  </script>
</body>
</html>
